name: generate_md5

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
    paths:
      - genshin/**
      - starrail/**
      - zzz/**

permissions:
  contents: write

jobs:
  generate:
    name: generate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: md5
        run: |
          python cal_md5.py
      - name: Commit metadata
        run: |
          git add genshin starrail zzz
          if git diff --cached --quiet; then
            echo "Metadata is already up to date."
            exit 0
          fi
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git commit -m "Auto generate md5"
          git push
